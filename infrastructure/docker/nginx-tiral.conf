# Tiral — playtiral.com
# Game WebSocket + matchmaking share one origin with the web client.

upstream tiral_web {
    server 127.0.0.1:3100;
}

upstream tiral_game {
    server 127.0.0.1:2567;
}

upstream tiral_api {
    server 127.0.0.1:2568;
}

server {
    server_name;

    # Next.js API routes + static assets (long cache for immutable chunks)
    location ^~ /api/ {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /_next/ {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Race listings API
    location = /races {
        proxy_pass http://tiral_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Colyseus matchmaking (HTTP)
    location /matchmake/ {
        proxy_pass http://tiral_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Colyseus room WebSockets: /<processId>/<roomId>
    location ~ "^/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$" {
        proxy_pass http://tiral_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/playtiral.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/playtiral.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {


    server_name;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}