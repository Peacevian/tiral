# Tiral — playtiral.com (the old address, tiral.geinz.lol, still served)
# Game WebSocket + matchmaking share one origin with the web client.

upstream tiral_web {
    server 127.0.0.1:3100;
}

upstream tiral_game {
    server 127.0.0.1:2567;
}

upstream tiral_api {
    server 127.0.0.1:2568;
}

# Per-IP request limits for endpoints that create accounts, store files,
# send mobile-money prompts or open game rooms. Loose on purpose: Ugandan
# mobile carriers put many phones behind one shared IP (CGNAT), so these only
# stop scripted floods, not a crowd. Zone names are prefixed: this server
# hosts other sites.
limit_req_zone $binary_remote_addr zone=tiral_signup:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=tiral_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tiral_payment:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=tiral_matchmake:10m rate=60r/m;

server {
    server_name playtiral.com www.playtiral.com tiral.geinz.lol;

    # One address: www goes to playtiral.com.
    if ($host = www.playtiral.com) {
        return 301 https://playtiral.com$request_uri;
    }

    # Compress JSON/JS/CSS from the proxied apps (nginx defaults to text/html
    # only). The road snapshot at /api/roads drops from ~300 KB to ~56 KB.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    limit_req_status 429;

    # Guest sign-up creates an account each time.
    location = /api/auth/guest {
        limit_req zone=tiral_signup burst=20 nodelay;
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Billboard images: the app accepts up to 2 MB (nginx defaults to 1 MB).
    location = /api/billboards/upload {
        limit_req zone=tiral_upload burst=5 nodelay;
        client_max_body_size 3m;
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Each purchase sends a mobile-money prompt (the app also limits per number).
    location = /api/billboards/purchase {
        limit_req zone=tiral_payment burst=3 nodelay;
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js API routes + static assets (long cache for immutable chunks)
    location ^~ /api/ {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /_next/ {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Race listings API
    location = /races {
        proxy_pass http://tiral_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Live player counts (admin dashboard). Exact match, so the room
    # WebSocket regex below doesn't claim it.
    location = /stats/live {
        proxy_pass http://tiral_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Colyseus matchmaking (HTTP)
    location /matchmake/ {
        limit_req zone=tiral_matchmake burst=30 nodelay;
        proxy_pass http://tiral_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Share pages (/r/CODE, /w/CODE/PLACE) belong to the web app: prefix
    # matches with ^~ win over the room-WebSocket regex below, which would
    # otherwise claim any two-part path.
    location ^~ /r/ {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /w/ {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Colyseus room WebSockets: /<processId>/<roomId>
    location ~ "^/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$" {
        proxy_pass http://tiral_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://tiral_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tiral.geinz.lol/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tiral.geinz.lol/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = tiral.geinz.lol) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = playtiral.com) {
        return 301 https://playtiral.com$request_uri;
    }
    if ($host = www.playtiral.com) {
        return 301 https://playtiral.com$request_uri;
    }

    server_name playtiral.com www.playtiral.com tiral.geinz.lol;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}