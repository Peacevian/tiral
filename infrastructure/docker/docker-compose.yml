services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_GAME_URL: wss://playtiral.com
        NEXT_PUBLIC_RACES_API_URL: https://playtiral.com
        NEXT_PUBLIC_NEW_BODIES: "1"
    env_file:
      - /opt/tiral/web.env
    network_mode: host
    volumes:
      - uploads-data:/data/uploads
    restart: unless-stopped

  game:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.game
    env_file:
      - /opt/tiral/game.env
    network_mode: host
    restart: unless-stopped

volumes:
  uploads-data:
