services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_GAME_URL: wss://tiral.geinz.lol
        NEXT_PUBLIC_RACES_API_URL: https://tiral.geinz.lol
    env_file:
      - /opt/tiral/web.env
    network_mode: host
    volumes:
      - uploads-data:/data/uploads
    restart: unless-stopped

  game:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.game
    env_file:
      - /opt/tiral/game.env
    network_mode: host
    restart: unless-stopped

volumes:
  uploads-data:
